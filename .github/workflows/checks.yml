name: Seedance source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: app:tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app tools run.py
      - run: python -m unittest app.test_passive_activity app.test_meal_reminders app.test_island app.test_pet_care app.test_token_calendar app.test_app_updates app.test_status_reactions.SchedulerTests tools.test_nicole_seedance tools.test_install_nicole_assets -q
      - run: python -m unittest app.test_action_audio -q
